apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-backend
  labels:
    app: monitor-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-backend
  template:
    metadata:
      labels:
        app: monitor-backend
    spec:
      serviceAccountName: monitor-backend-sa
      nodeSelector:
        kubernetes.io/hostname: instance-20260627-1620
      containers:
      - name: monitor-backend
        image: monitor-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: admin-token
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: gemini-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: anthropic-api-key
              optional: true
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: telegram-bot-token
              optional: true
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: telegram-chat-id
              optional: true
        volumeMounts:
        - mountPath: /host
          name: host-root
          readOnly: true
        - mountPath: /app/logs
          name: shared-logs
      - name: fluent-bit
        image: fluent/fluent-bit:2.2.0
        env:
        - name: LOKI_USER
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: loki-user
        - name: LOKI_PASSWD
          valueFrom:
            secretKeyRef:
              name: monitor-secrets
              key: loki-passwd
        volumeMounts:
        - mountPath: /app/logs
          name: shared-logs
        - mountPath: /fluent-bit/etc
          name: fluent-bit-config
      volumes:
      - name: host-root
        hostPath:
          path: /
      - name: shared-logs
        emptyDir: {}
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
